<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WAVE — YouTube to MP3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:        #0c0c0e;
  --bg2:       #111114;
  --bg3:       #18181d;
  --bg4:       #1f1f26;
  --line:      rgba(255,255,255,0.06);
  --line2:     rgba(255,255,255,0.11);
  --amber:     #f5a623;
  --amber2:    #ffbe4d;
  --amber3:    #7a4e0d;
  --red:       #e8453c;
  --green:     #2dce89;
  --white:     #f0eeea;
  --muted:     #5a5966;
  --muted2:    #7a7886;
  --syne:      'Syne', sans-serif;
  --mono:      'IBM Plex Mono', monospace;
}

html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--mono);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 1.25rem 5rem;
  overflow-x: hidden;
}

/* ─── Scanline overlay ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.07) 2px,
    rgba(0,0,0,0.07) 4px
  );
  pointer-events: none;
  z-index: 999;
}

/* ─── Top nav strip ─── */
.topbar {
  width: 100%;
  max-width: 780px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.5rem 0 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4rem;
}

.wordmark {
  font-family: var(--syne);
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--white);
}

.wordmark em {
  color: var(--amber);
  font-style: normal;
}

.topbar-badge {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 4px 10px;
  border: 1px solid var(--line2);
  border-radius: 2px;
}

/* ─── VU Meter strip (decorative) ─── */
.vu-strip {
  width: 100%;
  max-width: 780px;
  display: flex;
  gap: 3px;
  margin-bottom: 3rem;
  height: 48px;
  align-items: flex-end;
}

.vu-bar {
  flex: 1;
  background: var(--bg4);
  border-radius: 1px;
  position: relative;
  overflow: hidden;
}

.vu-bar::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--amber);
  border-radius: 1px;
  animation: vu var(--dur, 1.2s) ease-in-out infinite alternate;
}

@keyframes vu {
  0%   { height: var(--lo, 15%); opacity: 0.4; }
  100% { height: var(--hi, 80%); opacity: 1; }
}

/* ─── Hero text ─── */
.hero {
  width: 100%;
  max-width: 780px;
  margin-bottom: 3rem;
}

.hero-eyebrow {
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 10px;
}

.hero-eyebrow::before {
  content: '';
  display: inline-block;
  width: 24px;
  height: 1px;
  background: var(--amber);
}

.hero h1 {
  font-family: var(--syne);
  font-size: clamp(2.4rem, 6vw, 4rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--white);
  margin-bottom: 0.75rem;
}

.hero h1 span { color: var(--amber); }

.hero-sub {
  font-size: 0.78rem;
  color: var(--muted2);
  letter-spacing: 0.04em;
  line-height: 1.7;
}

/* ─── Main converter card ─── */
.converter {
  width: 100%;
  max-width: 780px;
  background: var(--bg2);
  border: 1px solid var(--line2);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 2px;
}

/* Card header row */
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 1.5rem;
  border-bottom: 1px solid var(--line);
  background: var(--bg3);
}

.card-header-label {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
}

.dots {
  display: flex;
  gap: 6px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--line2);
}

.dot.red   { background: #e8453c; }
.dot.amber { background: var(--amber3); }
.dot.green { background: #1a6b45; }

/* Card body */
.card-body {
  padding: 2rem 2rem 2rem;
}

/* ─── Preview card ─── */
.preview {
  display: none;
  background: var(--bg4);
  border: 1px solid var(--line2);
  border-radius: 3px;
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
  gap: 1rem;
  align-items: center;
  animation: slidein 0.2s ease;
}

.preview.show { display: flex; }

@keyframes slidein {
  from { opacity:0; transform: translateY(-8px); }
  to   { opacity:1; transform: translateY(0); }
}

.prev-thumb {
  width: 88px;
  height: 56px;
  object-fit: cover;
  border-radius: 2px;
  background: var(--bg3);
  flex-shrink: 0;
  border: 1px solid var(--line2);
}

.prev-info { flex: 1; min-width: 0; }

.prev-title {
  font-family: var(--syne);
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--white);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 5px;
}

.prev-meta {
  font-size: 0.65rem;
  color: var(--muted2);
  letter-spacing: 0.05em;
}

/* ─── URL section ─── */
.field-label {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.5rem;
}

.url-row {
  display: flex;
  gap: 8px;
  margin-bottom: 1.75rem;
}

.url-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line2);
  border-radius: 3px;
  padding: 13px 16px;
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--white);
  letter-spacing: 0.02em;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.url-input::placeholder { color: var(--muted); }

.url-input:focus {
  border-color: var(--amber);
  box-shadow: 0 0 0 2px rgba(245,166,35,0.12);
}

.paste-btn {
  background: var(--bg4);
  border: 1px solid var(--line2);
  border-radius: 3px;
  padding: 0 20px;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--muted2);
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.15s;
  white-space: nowrap;
}

.paste-btn:hover {
  border-color: var(--line2);
  color: var(--white);
  background: var(--bg3);
}

/* ─── Quality selector ─── */
.quality-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 2rem;
}

.q-btn {
  background: var(--bg);
  border: 1px solid var(--line2);
  border-radius: 3px;
  padding: 13px 10px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
}

.q-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: var(--amber);
  transform: scaleY(0);
  transition: transform 0.15s;
}

.q-btn.active::before { transform: scaleY(1); }

.q-btn:hover { border-color: var(--muted); }

.q-btn.active {
  background: rgba(245,166,35,0.05);
  border-color: rgba(245,166,35,0.3);
}

.q-name {
  font-family: var(--syne);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--white);
  display: block;
  margin-bottom: 3px;
}

.q-bit {
  font-size: 0.62rem;
  color: var(--muted2);
  display: block;
  letter-spacing: 0.05em;
}

.q-btn.active .q-name { color: var(--amber); }
.q-btn.active .q-bit  { color: rgba(245,166,35,0.6); }

/* ─── Convert button ─── */
.convert-btn {
  width: 100%;
  background: var(--amber);
  border: none;
  border-radius: 3px;
  padding: 17px;
  font-family: var(--syne);
  font-size: 0.95rem;
  font-weight: 700;
  color: #0c0c0e;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.convert-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transform: translateX(-100%);
}

.convert-btn:not(:disabled):hover {
  background: var(--amber2);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(245,166,35,0.25);
}

.convert-btn:not(:disabled):hover::after {
  transform: translateX(100%);
  transition: transform 0.5s;
}

.convert-btn:not(:disabled):active { transform: translateY(0); }

.convert-btn:disabled {
  background: var(--bg4);
  color: var(--muted);
  cursor: not-allowed;
  box-shadow: none;
}

/* ─── Progress ─── */
.progress-wrap {
  display: none;
  margin-top: 1.75rem;
  animation: slidein 0.2s ease;
}

.progress-wrap.show { display: block; }

.prog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.prog-status {
  font-size: 0.62rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted2);
  transition: color 0.3s;
  display: flex;
  align-items: center;
  gap: 7px;
}

.prog-status::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--muted);
  transition: background 0.3s;
}

.prog-status.live::before {
  background: var(--amber);
  box-shadow: 0 0 6px var(--amber);
  animation: blink 1s infinite;
}

.prog-status.ok::before { background: var(--green); box-shadow: 0 0 6px var(--green); }
.prog-status.fail::before { background: var(--red); }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

.prog-pct {
  font-size: 0.7rem;
  color: var(--muted2);
  letter-spacing: 0.04em;
}

.prog-track {
  height: 2px;
  background: var(--bg4);
  border-radius: 1px;
  overflow: hidden;
  margin-bottom: 6px;
}

.prog-fill {
  height: 100%;
  width: 0%;
  background: var(--amber);
  border-radius: 1px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1), background 0.4s;
  position: relative;
}

.prog-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 20px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5));
  border-radius: 1px;
}

.prog-fill.ok   { background: var(--green); }
.prog-fill.fail { background: var(--red); }

/* ─── Error ─── */
.err-box {
  display: none;
  margin-top: 1rem;
  border-left: 2px solid var(--red);
  padding: 10px 14px;
  background: rgba(232,69,60,0.07);
  border-radius: 0 3px 3px 0;
  font-size: 0.7rem;
  color: #ff9b96;
  letter-spacing: 0.03em;
  line-height: 1.6;
}
.err-box.show { display: block; }

/* ─── Download button ─── */
.dl-btn {
  display: none;
  width: 100%;
  margin-top: 1.25rem;
  background: transparent;
  border: 1px solid var(--green);
  border-radius: 3px;
  padding: 16px;
  font-family: var(--syne);
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--green);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  animation: slidein 0.25s ease;
}

.dl-btn.show { display: block; }
.dl-btn:hover { background: rgba(45,206,137,0.08); box-shadow: 0 0 20px rgba(45,206,137,0.1); }

/* ─── Bottom stat bar ─── */
.stat-bar {
  width: 100%;
  max-width: 780px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--line2);
  border-top: none;
  margin-bottom: 3rem;
}

.stat-cell {
  padding: 1.1rem 1.5rem;
  border-right: 1px solid var(--line);
}

.stat-cell:last-child { border-right: none; }

.stat-val {
  font-family: var(--syne);
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--amber);
  display: block;
  margin-bottom: 3px;
}

.stat-key {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ─── Footer ─── */


/* ─── Responsive ─── */
@media (max-width: 560px) {
  .hero h1 { font-size: 2rem; }
  .card-body { padding: 1.25rem; }
  .stat-bar { grid-template-columns: 1fr; }
  .stat-cell { border-right: none; border-bottom: 1px solid var(--line); }
  .stat-cell:last-child { border-bottom: none; }
  footer { flex-direction: column; gap: 1rem; text-align: center; }
  .vu-strip { height: 32px; }
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="wordmark">W<em>A</em>VE</div>
  <div class="topbar-badge">v2.0 · local</div>
</div>

<!-- VU Meter -->
<div class="vu-strip" id="vuStrip"></div>

<!-- Hero -->
<div class="hero">
  <div class="hero-eyebrow">Audio Extraction Engine</div>
  <h1>YouTube<br/>to <span>MP3.</span></h1>
</div>

<!-- Converter -->
<div class="converter">
  <div class="card-header">
    <span class="card-header-label">Signal Input</span>
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot amber"></div>
      <div class="dot green"></div>
    </div>
  </div>

  <div class="card-body">

    <!-- Preview -->
    <div class="preview" id="preview">
      <img class="prev-thumb" id="thumb" src="" alt=""/>
      <div class="prev-info">
        <div class="prev-title" id="prevTitle">—</div>
        <div class="prev-meta" id="prevMeta">—</div>
      </div>
    </div>

    <!-- URL -->
    <p class="field-label">Source URL</p>
    <div class="url-row">
      <input class="url-input" id="urlInput" type="text"
        placeholder="https://youtube.com/watch?v=…"
        autocomplete="off" spellcheck="false"/>
      <button class="paste-btn" onclick="doPaste()">Paste</button>
    </div>

    <!-- Quality -->
    <p class="field-label">Output Bitrate</p>
    <div class="quality-row">
      <button class="q-btn" onclick="pickQ('low',this)">
        <span class="q-name">Lo-Fi</span>
        <span class="q-bit">128 kbps</span>
      </button>
      <button class="q-btn active" onclick="pickQ('medium',this)">
        <span class="q-name">Standard</span>
        <span class="q-bit">192 kbps</span>
      </button>
      <button class="q-btn" onclick="pickQ('high',this)">
        <span class="q-name">Studio</span>
        <span class="q-bit">320 kbps</span>
      </button>
    </div>

    <!-- Convert -->
    <button class="convert-btn" id="convertBtn" onclick="startConvert()">
      ▶ &nbsp; Extract Audio
    </button>

    <!-- Progress -->
    <div class="progress-wrap" id="progWrap">
      <div class="prog-header">
        <span class="prog-status" id="progStatus">Queued</span>
        <span class="prog-pct" id="progPct">0%</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill" id="progFill"></div>
      </div>
    </div>

    <!-- Download -->
    <button class="dl-btn" id="dlBtn" onclick="doDownload()">
      ↓ &nbsp; Download MP3
    </button>

  </div>
</div>




<script>
/* ── VU Meter init ── */
(function(){
  const strip = document.getElementById('vuStrip');
  const count = Math.floor(window.innerWidth > 780 ? 120 : 60);
  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'vu-bar';
    const lo = 5 + Math.random() * 25;
    const hi = 30 + Math.random() * 65;
    const dur = 0.5 + Math.random() * 1.5;
    const delay = Math.random() * 1.5;
    b.style.cssText = `--lo:${lo}%;--hi:${hi}%;--dur:${dur}s;animation-delay:-${delay}s`;
    strip.appendChild(b);
  }
})();

/* ── Config ── */
// If backend is on a different domain, set this to e.g. 'https://wave-backend.onrender.com'
const BASE = '';

/* ── State ── */
let quality = 'medium';
let jobId   = null;
let pollTimer = null;
let infoTimer = null;

/* ── Quality ── */
function pickQ(q, btn) {
  quality = q;
  document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

/* ── Paste ── */
async function doPaste() {
  try {
    const t = await navigator.clipboard.readText();
    document.getElementById('urlInput').value = t;
    queueInfo(t);
  } catch { document.getElementById('urlInput').focus(); }
}

document.getElementById('urlInput').addEventListener('input', function(){
  clearTimeout(infoTimer);
  const v = this.value.trim();
  if (/youtube\.com|youtu\.be/.test(v)) {
    infoTimer = setTimeout(() => queueInfo(v), 900);
  } else {
    document.getElementById('preview').classList.remove('show');
  }
});

/* ── Info fetch ── */
async function queueInfo(url) {
  try {
    const r = await fetch(`${BASE}/api/info', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    const d = await r.json();
    if (d.title) {
      document.getElementById('prevTitle').textContent = d.title;
      const parts = [d.channel, d.duration].filter(Boolean);
      document.getElementById('prevMeta').textContent = parts.join(' · ');
      if (d.thumbnail) document.getElementById('thumb').src = d.thumbnail;
      document.getElementById('preview').classList.add('show');
    }
  } catch { /* silent */ }
}

/* ── Convert ── */
async function startConvert() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;

  setClass('dlBtn', false, 'show');
  setClass('progWrap', true, 'show');
  document.getElementById('convertBtn').disabled = true;
  setProgress(0, 'Queued', '');

  try {
    const r = await fetch(`${BASE}/api/convert', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url, quality})
    });
    const d = await r.json();
    if (!r.ok) { setClass('progWrap', false, 'show'); resetBtn(); return; }
    jobId = d.job_id;
    startPoll();
  } catch {
    setClass('progWrap', false, 'show');
    resetBtn();
  }
}

/* ── Poll ── */
function startPoll() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch(BASE + '/api/status/' + jobId;
      if (!r.ok) { clearInterval(pollTimer); resetBtn(); return; }
      const j = await r.json();
      const s = j.status, p = j.progress || 0;

      if      (s === 'queued')      setProgress(5,  'Queued',        '');
      else if (s === 'fetching')    setProgress(10, 'Fetching info', 'live');
      else if (s === 'downloading') setProgress(p,  'Downloading',  'live');
      else if (s === 'converting')  setProgress(p,  'Converting',   'live');
      else if (s === 'done') {
        clearInterval(pollTimer);
        // Hide progress, show only the download button — clean UI
        setClass('progWrap', false, 'show');
        setClass('dlBtn', true, 'show');
        document.getElementById('convertBtn').disabled = false;
        animateVU(true);
      } else if (s === 'error') {
        clearInterval(pollTimer);
        // Silent reset — just re-enable button, no scary error text
        setClass('progWrap', false, 'show');
        resetBtn();
      }
    } catch {
      // Network blip — stop polling, silently reset
      clearInterval(pollTimer);
      setClass('progWrap', false, 'show');
      resetBtn();
    }
  }, 700);
}

/* ── Download ── */
async function doDownload() {
  if (!jobId) return;
  const btn = document.getElementById('dlBtn');
  btn.textContent = '⏳  Preparing…';
  btn.disabled = true;
  try {
    const r = await fetch(BASE + '/api/download/' + jobId;
    if (!r.ok) {
      // File expired or job gone — silently re-enable so user can convert again
      setClass('dlBtn', false, 'show');
      resetBtn();
      return;
    }
    const cd   = r.headers.get('Content-Disposition') || '';
    const m    = cd.match(/filename\*?=(?:UTF-8'')?["']?([^;"'\n]+)/i);
    const name = m ? decodeURIComponent(m[1].replace(/['"]/g, '')) : 'audio.mp3';
    const blob = await r.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch {
    // Silent — just re-enable button
    setClass('dlBtn', false, 'show');
    resetBtn();
  } finally {
    btn.textContent = '↓ \u00a0 Download MP3';
    btn.disabled = false;
  }
}

/* ── Helpers ── */
function setProgress(pct, text, cls) {
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progPct').textContent = pct + '%';
  const s = document.getElementById('progStatus');
  s.textContent = text;
  s.className = 'prog-status' + (cls ? ' ' + cls : '');
}

function resetBtn() {
  document.getElementById('convertBtn').disabled = false;
}

function setClass(id, add, cls) {
  document.getElementById(id).classList[add ? 'add' : 'remove'](cls);
}

/* ── VU animate on success ── */
function animateVU(fast) {
  const bars = document.querySelectorAll('.vu-bar');
  bars.forEach(b => {
    if (fast) {
      b.style.setProperty('--lo', (50 + Math.random() * 30) + '%');
      b.style.setProperty('--hi', '100%');
      b.style.setProperty('--dur', (0.2 + Math.random() * 0.4) + 's');
    }
  });
  setTimeout(() => {
    bars.forEach(b => {
      b.style.setProperty('--lo', (5 + Math.random() * 25) + '%');
      b.style.setProperty('--hi', (30 + Math.random() * 65) + '%');
      b.style.setProperty('--dur', (0.5 + Math.random() * 1.5) + 's');
    });
  }, 1500);
}
</script>
